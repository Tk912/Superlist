# מעדכן מחירים ומפרסם את האתר ב-GitHub Pages.
# רץ כל שעה, בכל שינוי בקוד, וגם ידנית (Actions -> "האתר והמחירים" -> Run workflow).
# הקבצים של האפליקציה נמצאים בתיקייה superlist-cloud שבמאגר.
name: האתר והמחירים

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: הורדת מחירים
        run: python superlist-cloud/scripts/update_prices.py superlist-cloud/docs/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: superlist-cloud/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
