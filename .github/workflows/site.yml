# מעדכן מחירים ומפרסם את האתר ב-GitHub Pages.
# רץ כל חצי שעה (GitHub לפעמים מאחר), בכל שינוי בקוד, וגם ידנית (Actions -> "האתר והמחירים" -> Run workflow).
# הקבצים של האפליקציה נמצאים בתיקייה superlist-cloud שבמאגר.
name: האתר והמחירים

on:
  push:
    branches: [main]
  schedule:
    # לא בדקה עגולה (אז GitHub עמוס ומדלג), פעמיים בשעה
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # שם חדש לתור: ריצה ישנה נתקעה ב-GitHub בתור "pages" וחסמה את כל העדכונים (נובמבר 2026)
  group: site-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # היסטוריית המחירים נשמרת בין הרצות ב-cache (ויש עותק גם באתר עצמו, כגיבוי)
      - uses: actions/cache/restore@v4
        with:
          path: superlist-cloud/docs/data/history
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-
      - name: הורדת מחירים
        run: python superlist-cloud/scripts/update_prices.py superlist-cloud/docs/data
      - uses: actions/cache/save@v4
        if: always() && hashFiles('superlist-cloud/docs/data/history/**') != ''
        with:
          path: superlist-cloud/docs/data/history
          key: price-history-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: superlist-cloud/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
