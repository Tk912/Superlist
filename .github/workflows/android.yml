# בונה את אפליקציית "מילוי עגלה" לאנדרואיד ומפרסם אותה להורדה:
# https://github.com/Tk912/Superlist/releases/latest/download/superlist-cart.apk
# רץ כשמשנים משהו בתיקייה superlist-cloud/android, וגם ידנית (Actions -> "אפליקציית אנדרואיד" -> Run workflow).
# צריך פעם אחת סוד בשם ANDROID_KEYSTORE_B64 (Settings -> Secrets and variables -> Actions) עם מפתח החתימה.
name: אפליקציית אנדרואיד

on:
  push:
    branches: [main]
    paths:
      - "superlist-cloud/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: מפתח חתימה
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_B64 (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: בנייה
        working-directory: superlist-cloud/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          mkdir -p app/src/main/assets
          cp ../docs/cart.js app/src/main/assets/cart.js
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/superlist-cart.apk"
      - name: פרסום להורדה
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android "$RUNNER_TEMP/superlist-cart.apk" \
            --title "מילוי עגלה לאנדרואיד" \
            --notes "גרסה 1.${{ github.run_number }}. מתקינים את הקובץ superlist-cart.apk בטלפון." \
            --latest
