<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="הסל החכם">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>הסל החכם</title>
<style>
:root {
  --bg: #f4f6f3; --card: #ffffff; --text: #1b2620; --muted: #6b7a71; --line: #e3e8e4;
  --accent: #0f7a4a; --accent-soft: #e2f3ea; --warn: #b5470b; --warn-soft: #fdeee4;
  --chip: #eef2ef; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111613; --card: #1a211d; --text: #e6ece8; --muted: #93a39a; --line: #2a332e;
    --accent: #3cc486; --accent-soft: #173326; --warn: #f0965a; --warn-soft: #3a2518;
    --chip: #232c27; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Rubik, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#sync { font-size: 12px; color: var(--muted); }
#sync.off { color: var(--warn); }
main { padding: 0 16px calc(90px + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; }
nav { position: fixed; bottom: 0; inset-inline: 0; z-index: 6; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 9px 0 8px; font-size: 12px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
nav button .i { font-size: 21px; line-height: 1; }
nav button.on { color: var(--accent); font-weight: 600; }
.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; margin: 0 0 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; margin: 18px 2px 8px; color: var(--muted); font-weight: 600; }
h2:first-child { margin-top: 4px; }
input[type=text], input[type=search], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 10px 12px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .btn { color: #0b1a12; } }
.btn.ghost { background: var(--chip); color: var(--text); font-weight: 500; }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.icon-btn { border: 0; background: none; padding: 6px; cursor: pointer; font-size: 18px; color: var(--muted); line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip.add::before { content: "+ "; color: var(--accent); font-weight: 700; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; cursor: pointer;
  display: grid; place-items: center; background: none; padding: 0; }
.item.done .check { background: var(--accent); border-color: var(--accent); }
.item.done .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
.item.done .name { text-decoration: line-through; color: var(--muted); }
.item .name { cursor: pointer; }
.qty { display: flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; }
.qty button { border: 0; background: none; width: 28px; height: 28px; cursor: pointer; font-size: 16px; }
.qty span { min-width: 18px; text-align: center; font-size: 14px; cursor: pointer; }
.qty.kg span { min-width: 52px; white-space: nowrap; }
.price-tag { font-size: 12px; color: var(--accent); }
.who { font-size: 11px; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 7px; margin-inline-start: 4px; vertical-align: middle; }
.price-tag.none { color: var(--muted); }
.cat-title { font-size: 13px; color: var(--muted); margin: 6px 0 0; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 28px 10px; }
.day { padding: 10px 0; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day b { display: inline-block; width: 52px; }
.meal-chip { background: var(--accent-soft); color: var(--text); border: 0; border-radius: 999px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
.meal-chip::after { content: " ✕"; color: var(--muted); font-size: 11px; }
.chain-card { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.chain-card:last-child { border-bottom: 0; }
.chain-card .total { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { background: var(--accent); color: #fff; border-radius: 6px; font-size: 11px; padding: 2px 6px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .badge { color: #0b1a12; } }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: start; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.best { color: var(--accent); font-weight: 700; }
.scroll-x { overflow-x: auto; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 680px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.result { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.result:hover { background: var(--chip); }
.result .prices { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; margin-top: 2px; }
.result.with-img { display: flex; gap: 10px; align-items: center; }
.thumb { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: #fff; flex: none; }
.thumb.sm { width: 34px; height: 34px; cursor: zoom-in; }
.thumb-ph { width: 44px; height: 44px; border-radius: 8px; background: var(--chip); flex: none; display: grid; place-items: center; font-size: 22px; }
#add-form { position: relative; }
.ac { position: absolute; top: calc(100% + 4px); inset-inline: 0; z-index: 15; background: var(--card, var(--bg)); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 60vh; overflow: auto; padding: 4px 10px; }
.ac-row { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.ac-row:last-child { border-bottom: 0; }
.ac-row.sel, .ac-row:hover { background: var(--chip); }
.ac-row .nm { font-size: 15px; }
.ac-row .sub { font-size: 12px; color: var(--muted); }
.ac-fix { padding: 8px 4px; font-size: 14px; cursor: pointer; color: var(--accent); }
.big-img { width: 100%; max-height: 50vh; object-fit: contain; background: #fff; border-radius: 12px; }
.hidden { display: none !important; }
.toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); inset-inline: 16px; margin: auto; max-width: 420px;
  background: #1b2620; color: #fff; padding: 10px 14px; border-radius: 10px; z-index: 30; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🛒 הסל החכם</h1>
  <span id="sync"></span>
</header>
<main id="view"></main>
<nav>
  <button data-tab="list" class="on"><span class="i">📝</span>רשימה</button>
  <button data-tab="meals"><span class="i">📖</span>מתכונים</button>
  <button data-tab="prices"><span class="i">💰</span>מחירים</button>
  <button data-tab="settings"><span class="i">⚙️</span>הגדרות</button>
</nav>
<div id="sheet-root"></div>

<script src="prices.js"></script>
<script src="recipes.js"></script>
<script>
"use strict";
// ================= נתונים בסיסיים =================
const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
const CATS = [
  ["פירות וירקות", "עגבני מלפפון בצל שום תפוח בננה גזר פלפל חסה לימון תפוחי אדמה תפו\"א אבוקדו פטרוזיליה כוסברה שמיר נענע קישוא חציל ענבים תות אבטיח מלון פטריות כרוב ברוקולי כרובית בטטה תפוז קלמנטינה אגס אפרסק שזיף מנגו ירקות פירות דלעת סלק צנון"],
  ["חלב וביצים", "חלב גבינ יוגורט שמנת חמאה ביצים ביצה קוטג' קוטג לבן לבנה מעדן מילקי פודינג בולגרית צפתית ריקוטה מוצרלה פרמזן"],
  ["בשר ודגים", "עוף חזה שניצל בשר טחון סטייק כרעיים שוקיים פרגית כנפיים דג סלמון אמנון דניס נקניק נקניקיות הודו קבב המבורגר אנטריקוט"],
  ["לחם ומאפים", "לחם פיתות פיתה לחמני חלה באגט טורטיה עוגה עוגיות קרואסון בורקס לחמניות פירורי לחם"],
  ["מזווה", "אורז פסטה ספגטי קמח סוכר מלח שמן רוטב קטשופ מיונז חרדל תבלין פפריקה כמון כורכום פלפל שחור עדשים חומוס שעועית קפה תה דגני קורנפלקס ריבה דבש טחינה שוקולד ממרח שימורים רסק פתיתים קוסקוס אטריות תירס טונה זיתים חמוצים אבקת אפייה שמרים קקאו גרנולה שיבולת"],
  ["משקאות", "מים סודה קולה מיץ בירה יין משקה פריגת ספרייט נביעות"],
  ["קפואים", "קפוא קפואה קפואים גלידה אפונה ירקות קפואים בצק עלים פיצה"],
  ["חטיפים", "במבה ביסלי חטיף צ'יפס תפוצ'יפס קרקר בייגלה פופקורן ופל אגוזים שקדים גרעינים"],
  ["ניקיון ובית", "נייר טואלט מגבות נייר סבון כלים נוזל כלים אקונומיקה אבקת כביסה ג'ל כביסה מרכך כביסה מרכך שקיות אשפה שקיות נייר אלומיניום ניילון נצמד מגבונים ספוג מטליות מנקה פיירי טבליות למדיח"],
  ["טיפוח ותינוקות", "שמפו מרכך שיער משחת שיניים מברשת שיניים דאודורנט סבון גוף ג'ל רחצה טיטולים חיתולים מגבונים לחים קרם תחבושות צמר גפן"],
];
// רשתות שאפשר למלא בהן עגלה אוטומטית (לויקטורי אין קובצי מחירים, רק מילוי עגלה)
const CART_CHAINS = ["shufersal", "ramilevy", "carrefour", "hazihinam", "yochananof", "tivtaam", "victory"];
const CART_NAMES = { shufersal: "שופרסל", ramilevy: "רמי לוי", carrefour: "קרפור", hazihinam: "חצי חינם", yochananof: "יוחננוף", tivtaam: "טיב טעם", victory: "ויקטורי", wolt: "וולט מרקט" };
const ME_KEY = "superlist-me";
let me = (() => { try { return localStorage.getItem(ME_KEY) || ""; } catch { return ""; } })();
const CAT_ORDER =[...CATS.map(c => c[0]), "אחר"];
const QUICK = ["חלב", "לחם", "ביצים", "עגבניות", "מלפפונים", "בננות", "גבינה צהובה", "קוטג'", "עוף", "אורז", "פסטה", "נייר טואלט"];
const SEED_RECIPES = [
  ["שקשוקה", [["ביצים", 1], ["עגבניות", 6], ["בצל", 1], ["פלפל אדום", 1], ["רסק עגבניות", 1], ["לחם", 1]]],
  ["פסטה ברוטב עגבניות", [["פסטה", 1], ["רוטב עגבניות", 1], ["גבינה צהובה מגורדת", 1], ["שום", 1]]],
  ["עוף בתנור עם תפוחי אדמה", [["כרעיים עוף", 1], ["תפוחי אדמה", 6], ["בצל", 2], ["שום", 1], ["פפריקה", 1]]],
  ["שניצל ופירה", [["חזה עוף", 1], ["פירורי לחם", 1], ["ביצים", 1], ["תפוחי אדמה", 6], ["חמאה", 1]]],
  ["סלט ישראלי", [["עגבניות", 4], ["מלפפונים", 4], ["בצל סגול", 1], ["לימון", 1]]],
];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
const norm = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
const money = n => "₪" + (Math.round(n * 100) / 100).toFixed(2);

// השוואה בעברית: אותיות סופיות כרגילות (מלפפון/מלפפונים), ובלי ה' בסוף מילת מפתח (בננה/בננות)
const FINALS = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
const fin = s => norm(s).replace(/[ךםןףץ]/g, c => FINALS[c]);
const kw = w => { const k = fin(w); return k.length >= 4 && k.endsWith("ה") ? k.slice(0, -1) : k; };
const hasWord = (name, w) => fin(name).includes(kw(w));

function guessCat(name) {
  const n = " " + fin(name);
  let best = null;
  for (const [cat, words] of CATS) {
    const ws = words.split(" ");
    for (const w of ws.concat(ws.slice(1).map((x, k) => ws[k] + " " + x)).map(kw)) {
      const i = n.indexOf(w);
      if (i < 0) continue;
      const score = [i, -w.length];
      if (!best || score[0] < best.s[0] || (score[0] === best.s[0] && score[1] < best.s[1])) best = { cat, s: score };
    }
  }
  return best ? best.cat : "אחר";
}

// ================= משקל או כמות =================
// ירקות ופירות נקנים לפי משקל (ק"ג), כל השאר לפי כמות יחידות/אריזות
const KG_STEP = 0.5;
// ירקות שנמכרים ביחידות או באריזה (צרור, קופסה) למרות שהם בקטגוריית ירקות
const PRODUCE_BY_UNIT = ["שום", "פטרוזיליה", "כוסברה", "שמיר", "נענע", "בזיליקום", "בצל ירוק", "פטריות", "תות", "שרי", "נבטים", "חסה", "כרוב", "כרובית", "אבטיח", "מלון", "אננס", "ארוז", "מארז", "סלסלה"];
// משקל ממוצע ליחידה, כדי להמיר "6 עגבניות" (במתכון) לק"ג
const UNIT_WEIGHT = [["תפוחי אדמה", 0.2], ["תפו\"א", 0.2], ["בטטה", 0.3], ["חציל", 0.35], ["מנגו", 0.3], ["אבוקדו", 0.25], ["פלפל", 0.2],
  ["עגבני", 0.15], ["מלפפון", 0.12], ["בצל", 0.15], ["תפוח", 0.18], ["תפוז", 0.2], ["בננ", 0.15], ["אגס", 0.18], ["קישוא", 0.2],
  ["גזר", 0.1], ["לימון", 0.1], ["קלמנטינ", 0.08], ["אפרסק", 0.15], ["שזיף", 0.07], ["שום", 0.05], ["סלק", 0.2], ["צנון", 0.05]];
const unitWeight = name => (UNIT_WEIGHT.find(([w]) => hasWord(name, w)) || [0, 0.2])[1];
const soldByWeight = name => guessCat(name) === "פירות וירקות" && !PRODUCE_BY_UNIT.some(w => hasWord(name, w));
const roundKg = kg => Math.max(KG_STEP, Math.ceil(kg / KG_STEP - 1e-9) * KG_STEP);
const fmtNum = x => (Math.round(x * 100) / 100).toString();
const fmtQty = i => i.unit === "kg" ? `${fmtNum(i.qty)} ק״ג` : `${i.qty}`;
const itemKg = i => i.unit === "kg" ? i.qty : roundKg((i.qty || 1) * unitWeight(i.name));

// "1.5 ק"ג עגבניות" / "עגבניות 2 קילו" / "500 גרם בננות" / "3 עגבניות" / "חלב x2" -> {name, qty, unit}
const KG_RE = /^(?:ק"ג|ק״ג|קג|קילו|kg)$/i, G_RE = /^(?:גרם|גר'?|ג'|g)$/i;
function parseQty(text) {
  let s = String(text || "").trim().replace(/\s+/g, " "), m;
  const num = x => Number(String(x).replace(",", "."));
  const unitOf = (n, u) => KG_RE.test(u) ? { qty: num(n), unit: "kg" } : { qty: num(n) / 1000, unit: "kg" };
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)\s*(ק"ג|ק״ג|קג|קילו|kg|גרם|גר'?|ג'|g)\s+(.+)$/i))) return { name: m[3], ...unitOf(m[1], m[2]) };
  if ((m = s.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(ק"ג|ק״ג|קג|קילו|kg|גרם|גר'?|ג'|g)$/i))) return { name: m[1], ...unitOf(m[2], m[3]) };
  if ((m = s.match(/^(.+?)\s*(?:[xX×*]\s*(\d+)|\((\d+)\)|[-–:]\s*(\d+)(?:\s*(?:יח'?|יחידות))?)$/))) return { name: m[1], qty: Number(m[2] || m[3] || m[4]), unit: "unit" };
  if ((m = s.match(/^(\d+)\s*[xX×*]?\s+(.+)$/))) return { name: m[2], qty: Number(m[1]), unit: "unit" };
  if ((m = s.match(/^(.+?)\s+(\d+)\s*(?:יח'?|יחידות|אריזות|חבילות)$/))) return { name: m[1], qty: Number(m[2]), unit: "unit" };
  return { name: s, qty: 1, unit: null };
}

// ================= מצב וסנכרון =================
const LS = "superlist-state-v1";
let S = loadLocal();
let chains = {};        // {chain: "שם"}
let compareCache = null;
let online = false, saving = false, dirty = false, saveTimer = null;
let tab = "list";

function blank() {
  return { rev: 0, items: [], history: {}, recipes: SEED_RECIPES.map(([name, ing]) => ({ id: uid(), t: 1, name, ingredients: ing.map(([n, q]) => ({ name: n, qty: q })) })),
    plan: { t: 0, days: {} }, settings: { t: 0, stores: {} } };
}
function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.items) return s; } catch {}
  return blank();
}
function fill(s) {
  const b = blank();
  if (!s || !Array.isArray(s.items)) return b;
  s.history ||= {}; s.recipes ||= b.recipes; s.plan ||= b.plan; s.plan.days ||= {}; s.settings ||= b.settings; s.settings.stores ||= {};
  // פריטים מגרסה קודמת: ירקות ופירות עוברים לק"ג, כל השאר ליחידות; מחלקה מחושבת מחדש (תיקון אותיות סופיות)
  for (const i of s.items) {
    if (i.uv === 2) continue;
    const h = s.history[norm(i.name)];
    if (!i.cat || i.cat === "אחר") i.cat = h?.cat && h.cat !== "אחר" ? h.cat : guessCat(i.name);
    const unit = h?.unit || (soldByWeight(i.name) ? "kg" : "unit");
    // כמות 1 ("מלפפונים") = 1 ק"ג, כמו בהוספה חדשה; מספר יחידות ("6 עגבניות") -> משקל משוער
    if (unit === "kg" && i.unit !== "kg") i.qty = (i.qty || 1) <= 1 ? 1 : roundKg(i.qty * unitWeight(i.name));
    i.unit = unit;
    i.uv = 2;
  }
  return s;
}

function mergeById(a = [], b = []) {
  const m = new Map();
  for (const x of [...a, ...b]) { const y = m.get(x.id); if (!y || (x.t || 0) > (y.t || 0)) m.set(x.id, x); }
  const cutoff = now() - 30 * 864e5;
  return [...m.values()].filter(x => !x.deleted || x.t > cutoff);
}
function merge(local, server) {
  server = fill(server);
  const hist = { ...server.history };
  for (const [k, h] of Object.entries(local.history || {})) {
    const o = hist[k];
    if (!o) { hist[k] = h; continue; }
    const buys = [...new Set([...(o.buys || []), ...(h.buys || [])])].sort((x, y) => x - y).slice(-12);
    hist[k] = { ...((h.t || 0) > (o.t || 0) ? h : o), buys };
  }
  return {
    rev: server.rev,
    items: mergeById(server.items, local.items),
    recipes: mergeById(server.recipes, local.recipes),
    history: hist,
    plan: (local.plan.t || 0) > (server.plan.t || 0) ? local.plan : server.plan,
    settings: (local.settings.t || 0) > (server.settings.t || 0) ? local.settings : server.settings,
  };
}

let priceTimer = null;
function commit() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch {}
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 600);
  render();
  // מחיר הסל מתעדכן אחרי כל שינוי ברשימה
  clearTimeout(priceTimer);
  priceTimer = setTimeout(() => refreshCompare().then(render), 300);
}

// ---------- שמירה ב-Firebase (cloud.js) ----------
// כל שמירה ממזגת את מה שבשרת עם המקומי, כך ששני אנשים יכולים לערוך באותו זמן.
let members = [], unwatch = null, onlineChecked = false;

async function push() {
  if (saving || !dirty || !window.Cloud?.user) return;
  saving = true;
  const sent = JSON.stringify(S);
  try {
    const result = await Cloud.save(server => server ? merge(JSON.parse(sent), server) : JSON.parse(sent));
    members = result.members || members;
    // שינויים שנעשו בזמן השמירה לא הולכים לאיבוד
    if (JSON.stringify(S) !== sent) { S = merge(S, result); dirty = true; }
    else { S = fill(result); dirty = false; }
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch {}
    setOnline(true);
  } catch (e) {
    console.warn("save failed", e);
    setOnline(false);
  }
  saving = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(push, 3000); }
  render();
}

// עדכונים בזמן אמת מהשותפים
function onServerData(data) {
  setOnline(true);
  members = data.members || [];
  if (saving) return;
  const before = new Map(S.items.map(i => [i.id, i]));
  S = dirty ? merge(S, data) : fill(data);
  notifyOthers(before);
  if (!onlineChecked) { onlineChecked = true; setTimeout(ensureOnlineStores, 0); }
  refreshCompare().then(render);
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch {}
  render();
  if (dirty) push();
}

// הודעה כשמישהו אחר הוסיף או מחק פריטים
function notifyOthers(before) {
  const added = {}, removed = {};
  for (const i of S.items) {
    const b = before.get(i.id), who = i.by || "מישהו";
    if (!b && !i.deleted && !(me && i.by === me)) (added[who] ||= []).push(i.name);
    else if (b && !b.deleted && i.deleted && i.delBy && i.delBy !== me) (removed[i.delBy] ||= []).push(i.name);
  }
  const msg = [
    ...Object.entries(added).map(([w, n]) => `${w} הוסיף/ה: ${n.slice(0, 4).join(", ")}${n.length > 4 ? "…" : ""}`),
    ...Object.entries(removed).map(([w, n]) => `${w} הוריד/ה: ${n.slice(0, 4).join(", ")}${n.length > 4 ? "…" : ""}`),
  ].join(" · ");
  if (msg && before.size) toast(msg);
}

// ================= רשימה =================
const live = () => S.items.filter(i => !i.deleted);

// unit: "kg" / "unit" / null (= לפי סוג המוצר). qty בק"ג כשהיחידה ק"ג.
function addItem(name, qty = 1, from, unit = null) {
  name = String(name || "").trim();
  if (!name) return;
  const key = norm(name);
  const h = S.history[key];
  const ex = live().find(i => norm(i.name) === key && !i.done);
  // ירקות/פירות -> ק"ג; גם כל מה שנכתב במפורש בק"ג (למשל "1.5 ק"ג כרעיים עוף" ממתכון)
  const want = ex?.unit || h?.unit || (unit === "kg" || soldByWeight(name) ? "kg" : "unit");
  // "3 עגבניות" לפריט שנמכר במשקל -> הערכה בק"ג ("עגבניות" בלי כמות = 1 ק"ג);
  // "1 ק"ג" לפריט ביחידות -> יחידה אחת לפחות
  let q = Number(qty) || 1;
  if (want === "kg" && unit === "unit") q = q * unitWeight(name);
  if (want === "unit" && unit === "kg") q = Math.max(1, Math.round(q));
  if (ex) {
    ex.qty = want === "kg" ? roundKg((ex.qty || 0) + q) : (ex.qty || 1) + q;
    ex.t = now();
  } else {
    S.items.push({ id: uid(), t: now(), name, qty: want === "kg" ? roundKg(q) : q, unit: want, uv: 2, done: false, cat: h?.cat || guessCat(name),
      code: h?.code || null, product: h?.product || null, from: from || null, by: me || null });
  }
}

function suggestions() {
  const onList = new Set(live().map(i => norm(i.name)));
  const t = now(), due = [], freq = [];
  for (const [k, h] of Object.entries(S.history)) {
    if (onList.has(k) || !h.buys?.length) continue;
    const b = h.buys;
    if (b.length >= 2) {
      const avg = (b[b.length - 1] - b[0]) / (b.length - 1);
      if (avg > 864e5 && t - b[b.length - 1] >= avg * 0.85) { due.push({ name: h.name, score: (t - b[b.length - 1]) / avg }); continue; }
    }
    freq.push({ name: h.name, score: b.length });
  }
  due.sort((a, b) => b.score - a.score); freq.sort((a, b) => b.score - a.score);
  return { due: due.slice(0, 8).map(x => x.name), freq: freq.slice(0, 10).map(x => x.name) };
}

function finishShopping() {
  const done = live().filter(i => i.done);
  if (!done.length) return toast("סמן קודם את מה שקנית");
  const t = now();
  for (const i of done) {
    const k = norm(i.name), h = S.history[k] || { name: i.name, buys: [] };
    // קנייה באותו יום נחשבת אחת
    if (!h.buys.length || t - h.buys[h.buys.length - 1] > 12 * 36e5) h.buys = [...h.buys, t].slice(-12);
    Object.assign(h, { name: i.name, cat: i.cat, code: i.code || h.code || null, product: i.product || h.product || null, unit: i.unit || h.unit, t });
    S.history[k] = h;
    Object.assign(i, { deleted: true, t });
  }
  commit();
  toast(`נשמרו ${done.length} פריטים בהיסטוריה 👍`);
}

function priceFor(item) {
  if (!item.code || !compareCache) return null;
  const line = compareCache.lines.find(l => l.code === String(item.code).replace(/^0+/, ""));
  if (!line) return null;
  const e = Object.entries(line.prices);
  if (!e.length) return { none: true };
  e.sort((a, b) => a[1] - b[1]);
  return { price: e[0][1], chain: chains[e[0][0]] || e[0][0], weighted: line.weighted };
}

  ${!items.length ? `<h2>${sug.freq.length ? "קונים בדרך כלל" : "הוספה מהירה"}</h2><div class="chips">${(sug.freq.length ? sug.freq : QUICK).map(n => `<button class="chip add" data-add="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
  <h2>${open.length ? `ברשימה (${open.length})` : ""}</h2>

  ${basketCard()}

  const order = [...CART_CHAINS].sort((a, b) => (totals[a]?.total ?? 1e9) - (totals[b]?.total ?? 1e9));

// ================= ייבוא מ-AddIt (או כל רשימה כטקסט) =================
function parseListText(text) {
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || /https?:\/\//.test(line) || /addit/i.test(line) || /:$/.test(line)) continue;
    if (/^[✓✔✅☑]/.test(line) || /^\[[xX✓]\]/.test(line)) continue; // כבר נקנה
    // תבליטים, תיבות סימון ומספור ("1." / "1)")
    line = line.replace(/^(?:\[\s?\]\s*|[-–•*·▪◦☐⬜🔲]\s*|\d+[.)]\s+)+/u, "").trim();
    const p = parseQty(line);
    const name = p.name.trim();
    const qty = p.unit === "kg" ? Math.min(Math.max(p.qty || KG_STEP, 0.1), 50) : Math.min(Math.max(p.qty || 1, 1), 50);
    if (name && name.length <= 60) out.push({ name, qty, unit: p.unit });
  }
  return out;
}

// תצוגה מקדימה: איך הפריט ייכנס לרשימה (ק"ג או יחידות)
function previewQty(x) {
  const kg = soldByWeight(x.name) && x.unit !== "unit" ? true : soldByWeight(x.name) ? "est" : false;
  if (x.unit === "kg" || kg === true) return `${x.name} ${fmtNum(x.unit === "kg" ? x.qty : 1)} ק״ג`;
  if (kg === "est") return `${x.name} ~${fmtNum(roundKg(x.qty * unitWeight(x.name)))} ק״ג`;
  return x.qty > 1 ? `${x.name} ×${x.qty}` : x.name;
}

// מה בדיוק לשים בעגלה: לכל פריט הקוד של אותה רשת (מההשוואה), כמות יחידות וק"ג
function cartJob(chain) {
  const items = live().filter(i => !i.done);
  const linked = items.filter(i => i.code);
  const lines = PriceDB.info().data[chain] && linked.length
    ? PriceDB.compare(linked.map(i => ({ code: i.code, qty: i.qty, unit: i.unit, kg: itemKg(i), name: i.name, product: i.product }))).lines
    : [];
  const byName = Object.fromEntries(linked.map((i, k) => [i.id, lines[k]]));
  return {
    superlist: 1, chain,
    items: items.map(i => {
      const l = byName[i.id];
      return {
        name: i.name,
        qty: i.unit === "kg" ? Math.max(1, Math.round(i.qty)) : i.qty || 1,
        kg: itemKg(i),
        weighted: i.unit === "kg" || !!l?.weighted,
        code: l ? l.codes[chain] || null : i.code || null,
        product: l ? l.names[chain] || i.product || null : i.product || null,
      };
    }),
  };
}

// ---------- ייבוא מתכון מטקסט (מכל אתר) ----------
const HEB_NUM = { "חצי": 0.5, "רבע": 0.25, "שליש": 1 / 3, "אחד": 1, "אחת": 1, "שני": 2, "שתי": 2, "שניים": 2, "שתיים": 2, "שלוש": 3, "שלושה": 3,
  "ארבע": 4, "ארבעה": 4, "חמש": 5, "חמישה": 5, "שש": 6, "שישה": 6, "שבע": 7, "שבעה": 7, "שמונה": 8, "תשע": 9, "עשר": 10 };
const FRACTIONS = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3 };
const MEASURE_RE = /^(כוס(?:ות)?|כפ(?:ית|יות|ות)|כף|גר(?:ם|'|ם)?|ג'|ק"ג|ק״ג|קג|קילו(?:גרם)?|מ"ל|מ״ל|מל|ליטר(?:ים)?|יח(?:ידות|ידה|')?|שי?נ(?:י|ן)|שן|חבילה|חבילות|חבילת|פחי(?:ת|ות)|קופס(?:ה|ת|את|אות)|צרור(?:ות)?|קורט|קמצוץ|חופן|חופנים|ענף|ענפי|ענפים|שקית|שקיות|בקבוק|גבע(?:ול|ולים)|פרוס(?:ה|ות)|מעט)\s+/;

function parseIngredientLine(line) {
  let s = line.replace(/^[\s\-–•*·▪◦☐✓✔\d+[.)]\s]+(?=\D)/, "").replace(/\([^)]*\)/g, "").trim();
  s = s.replace(/^(\d+)\s*-\s*\d+/, "$1"); // "2-3 עגבניות" -> 2
  let qty = null, m;
  if ((m = s.match(/^(\d+)\s*\/\s*(\d+)\s*/))) { qty = +m[1] / +m[2]; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(\d+)\s+(\d)\/(\d)\s*/))) { qty = +m[1] + +m[2] / +m[3]; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔])?\s*/)) && m[0].trim()) { qty = Number(m[1].replace(",", ".")) + (FRACTIONS[m[2]] || 0); s = s.slice(m[0].length); }
  else if ((m = s.match(/^([½¼¾⅓⅔])\s*/))) { qty = FRACTIONS[m[1]]; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(\S+)\s+/)) && HEB_NUM[m[1]] !== undefined) { qty = HEB_NUM[m[1]]; s = s.slice(m[0].length); }
  let measure = null;
  if ((m = s.match(MEASURE_RE))) { measure = m[1]; s = s.slice(m[0].length); }
  // "גרם/ק"ג" שנכתבו צמוד למספר: "500גרם"
  s = s.replace(/^(?:של|מ)\s+/, "").split(/[,–:]| - /)[0].trim();
  // מורידים תיאורים מהסוף ("3 גזרים גדולים קלופים" -> גזרים), גם כמה ברצף
  const DESC = /\s+ו?(?:קצוץ|קצוצה|קצוצים|קצוצות|טרי|טריה|טריים|טריות|מגורד|מגורדת|פרוס|פרוסה|פרוסים|חתוך|חתוכה|חתוכים|מבושל|מבושלת|גדול|גדולה|גדולים|גדולות|בינוני|בינונית|בינוניים|בינוניות|קטן|קטנה|קטנים|קטנות|בשל|בשלה|בשלים|בשלות|קלוף|קלופה|קלופים|קלופות|מרוסק|מרוסקת|לפי הטעם|לקישוט)$/;
  while (DESC.test(s)) s = s.replace(DESC, "").trim();
  if (!s || s.length > 40) return null;
  const name = s;
  const grams = /^(גר|ג'|גרם)/.test(measure || "") ? qty : /^(ק"ג|ק״ג|קג|קילו)/.test(measure || "") ? (qty || 1) * 1000 : null;
  let item;
  if (soldByWeight(name)) {
    // ירקות ופירות: משקל בק"ג (גרמים -> ק"ג; מספר יחידות -> הערכה)
    const kg = grams ? grams / 1000 : (qty || 1) * unitWeight(name);
    item = { name, qty: roundKg(kg), unit: "kg" };
  } else {
    // כל השאר: אריזה אחת, או מספר יחידות אם נכתב ("3 ביצים" -> אריזה; "2 פחיות טונה" -> 2)
    const count = /^(פחי|קופס|חבילה|חבילות|חבילת|יח|שקי|בקבוק)/.test(measure || "") ? Math.max(1, Math.round(qty || 1)) : 1;
    item = { name, qty: count, unit: "unit" };
  }
  item.pantry = isPantry(name) || /^(קורט|קמצוץ|מעט)/.test(measure || "");
  item.line = line.trim();
  return item;
}

function parseRecipeText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const isHead = (l, words) => new RegExp(`^(${words})\\s*[:：]?$`).test(l.replace(/[^֐-׿\s:]/g, "").trim());
  const ingStart = lines.findIndex(l => isHead(l, "מצרכים|רכיבים|החומרים|חומרים|מרכיבים|מצרכים למתכון|לבצק|לרוטב|למילוי"));
  const stepStart = lines.findIndex((l, i) => i > ingStart && isHead(l, "אופן ההכנה|אופן הכנה|הכנה|הוראות הכנה|הוראות|שלבי הכנה|דרך ההכנה"));
  const title = (lines.find((l, i) => (ingStart < 0 || i < ingStart) && l.length < 50 && !/^\d/.test(l) && !isHead(l, "מצרכים|רכיבים")) || "מתכון חדש")
    .replace(/^מתכון\s*(ל|של)?\s*/, "").trim();
  let body = ingStart >= 0 ? lines.slice(ingStart + 1, stepStart > ingStart ? stepStart : undefined) : lines.slice(1);
  // בלי כותרת "מצרכים": לוקחים שורות קצרות שנראות כמו מצרכים, עד שמתחילים משפטים ארוכים
  if (ingStart < 0) body = body.filter(l => l.length <= 45 && !/[.!?]$/.test(l));
  const subHead = l => /:\s*$/.test(l) && l.length < 25; // "לרוטב:" וכדומה
  const ingredients = [];
  for (const l of body) {
    if (subHead(l)) continue;
    const p = parseIngredientLine(l);
    if (p && !ingredients.some(x => norm(x.name) === norm(p.name))) ingredients.push(p);
  }
  const servings = +((text.match(/(\d+)\s*(?:מנות|סועדים|אנשים)/) || [])[1] || 4);
  return { name: title, servings, ingredients };
}

// ---------- הוספת מצרכים לרשימה (עם בחירת מספר מנות) ----------
function addRecipeSheet(recipe, fromLibrary) {
  const base = recipe.servings || 4;
  let servings = base;
  const picked = recipe.ingredients.map(x => !x.pantry);
  const scaled = x => {
    const f = servings / base;
    // ק"ג גדל ביחס למנות; אריזות גדלות רק כשבאמת צריך (1.5 אריזה -> 1, 1.75 -> 2)
    return x.unit === "kg" ? roundKg(x.qty * f) : Math.max(1, Math.round((Number(x.qty) || 1) * f - 0.25));
  };
  const draw = () => {
    sheet(`<h2 style="margin-top:0">🛒 ${esc(recipe.name)}</h2>
      <div class="row" style="margin-bottom:8px"><div class="grow">מספר מנות</div>
        <div class="qty"><button id="rs-dec">−</button><span>${servings}</span><button id="rs-inc">+</button></div></div>
      <div class="card">${recipe.ingredients.map((x, k) => `<label class="item" style="cursor:pointer">
        <input type="checkbox" data-k="${k}" ${picked[k] ? "checked" : ""} style="width:20px;height:20px">
        <div class="grow">${esc(x.name)}${x.pantry ? ` <span class="who">יש בבית?</span>` : ""}</div>
        <span class="muted">${x.unit === "kg" ? fmtNum(scaled(x)) + " ק״ג" : "×" + scaled(x)}</span></label>`).join("")}</div>
      <div class="muted" style="margin-bottom:8px">מה שכבר ברשימה לא יוכפל: הכמות פשוט תגדל.</div>
      <div class="row"><button class="btn grow" id="rs-go">הוסף ${picked.filter(Boolean).length} מצרכים לרשימה</button>
      ${fromLibrary ? `<button class="btn ghost" id="rs-save">גם שמור מתכון</button>` : ""}</div>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-close>ביטול</button>`);
    $("#rs-dec").onclick = () => { if (servings > 1) { servings--; draw(); } };
    $("#rs-inc").onclick = () => { servings++; draw(); };
    $("#sheet-root").querySelectorAll("[data-k]").forEach(c => c.onchange = () => { picked[+c.dataset.k] = c.checked; draw(); });
    $("#rs-go").onclick = () => {
      const chosen = recipe.ingredients.filter((x, k) => picked[k]);
      chosen.forEach(x => addItem(x.name, scaled(x), "recipe", x.unit === "kg" ? "kg" : "unit"));
      commit(); closeSheet();
      toast(`נוספו ${chosen.length} מצרכים מ"${recipe.name}" לרשימה`);
      document.querySelector('nav button[data-tab="list"]')?.click();
    };
    if ($("#rs-save")) $("#rs-save").onclick = () => {
      if (!recipeList().some(r => norm(r.name) === norm(recipe.name))) { S.recipes.push({ ...recipe, id: uid(), t: now() }); commit(); toast("המתכון נשמר אצלך"); }
      $("#rs-save").remove();
    };
  };
  draw();
}

// ---------- עריכת מתכון ----------
function recipeSheet(id) {
  const r = id === "new" ? { id: uid(), name: "", servings: 4, ingredients: [] } : S.recipes.find(x => x.id === id);
  const text = r.ingredients.map(x => (x.unit === "kg" ? `${fmtNum(x.qty)} ק״ג ` : Number(x.qty) > 1 ? x.qty + " " : "") + x.name + (x.pantry ? " *" : "")).join("\n");
  sheet(`<h2 style="margin-top:0">${id === "new" ? "מתכון חדש" : "עריכת מתכון"}</h2>
    <div class="row"><input type="text" id="r-name" placeholder="שם המתכון" value="${esc(r.name)}" class="grow">
      <input type="text" id="r-serv" value="${r.servings || 4}" style="width:70px;text-align:center" inputmode="numeric" title="מנות"></div>
    <div class="muted" style="margin:8px 0">מצרך בכל שורה: "1 ק״ג תפוחי אדמה", "6 עגבניות", "2 פסטה". כוכבית בסוף (*) = בדרך כלל יש בבית.</div>
    <textarea id="r-ing" rows="10">${esc(text)}</textarea><br><br>
    <div class="row"><button class="btn grow" id="r-save">שמור</button>
    ${id === "new" ? "" : `<button class="btn ghost" id="r-del">מחק</button>`}
    <button class="btn ghost" data-close>ביטול</button></div>`);
  $("#r-save").onclick = () => {
    const name = $("#r-name").value.trim();
    if (!name) return toast("צריך שם למתכון");
    const ingredients = $("#r-ing").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const pantry = /\*\s*$/.test(l);
      const p = parseQty(l.replace(/\*\s*$/, ""));
      const unit = p.unit === "kg" ? "kg" : soldByWeight(p.name) && p.unit !== "unit" ? "kg" : "unit";
      const qty = p.unit === "kg" ? p.qty : unit === "kg" ? roundKg((p.qty || 1) * (p.unit === "unit" ? unitWeight(p.name) : 1)) : p.qty || 1;
      return { name: p.name, qty, unit, pantry: pantry || isPantry(p.name) };
    });
    Object.assign(r, { name, servings: Math.max(1, +$("#r-serv").value || 4), ingredients, t: now() });
    if (id === "new") S.recipes.push(r);
    closeSheet(); commit();
  };
  if ($("#r-del")) $("#r-del").onclick = () => { if (confirm("למחוק את המתכון?")) { Object.assign(r, { deleted: true, t: now() }); closeSheet(); commit(); } };
}

// ================= מחירים =================
function selected() { return Object.fromEntries(Object.entries(S.settings.stores).filter(([, v]) => v)); }

async function refreshCompare() {
  if (!Object.keys(selected()).length) { compareCache = null; return; }
  try {
    await PriceDB.load(selected());
    // פריט חדש מקבל מוצר אוטומטית (אפשר להחליף ב-🔗), כדי שמחיר הסל יופיע מיד
    let linked = 0;
    for (const i of live().filter(i => !i.code && !i.noLink)) {
      const r = PriceDB.search(i.name, 10);
      const pick = (i.unit === "kg" && r.find(x => x.weighted)) || r[0];
      if (pick) { matchUnit(i, pick.weighted); Object.assign(i, { code: pick.code, product: pick.name, auto: true, t: now() }); linked++; }
    }
    if (linked) commit();
    const items = live().filter(i => i.code).map(i => ({ code: i.code, qty: i.qty || 1, unit: i.unit, kg: itemKg(i), name: i.name, product: i.product }));
    compareCache = PriceDB.compare(items);
  } catch (e) { console.warn(e); compareCache = null; }
}

// ================= מועדי משלוח (דרך תוסף הכרום "הסל החכם – מועדי משלוח") =================
// האתרים של הרשתות לא מאפשרים לאפליקציה לקרוא מועדי משלוח ישירות, אז התוסף קורא אותם בדפדפן שלך.
let slots = null, slotsAt = 0, slotsLoading = false;
const hasExt = () => !!document.documentElement.dataset.superlistExt;
const DAYS_SHORT = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
function fmtSlot(r) {
  if (!r?.ok) return null;
  if (r.eta) return r.eta;
  const d = new Date(r.from), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t) / 864e5);
  const day = diff === 0 ? "היום" : diff === 1 ? "מחר" : `יום ${DAYS_SHORT[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
  return `${day} ${r.from.slice(11, 16)}${r.to ? "–" + r.to.slice(11, 16) : ""}`;
}
// הרשת עם המשלוח הקרוב ביותר (Wolt Market נחשבת רק אם נבחרה חנות שלה)
function fastestChain(chainsList) {
  if (!slots) return null;
  const cands = chainsList.filter(c => slots[c]?.ok && (c !== "wolt" || selected().wolt));
  if (cands.includes("wolt")) return "wolt";
  return cands.filter(c => slots[c].from).sort((a, b) => slots[a].from.localeCompare(slots[b].from))[0] || null;
}
function requestSlots(force = false) {
  if (!hasExt() || slotsLoading || (!force && slots && Date.now() - slotsAt < 10 * 60 * 1000)) return Promise.resolve(slots);
  slotsLoading = true;
  const id = uid();
  const chainsList = [...new Set([...CART_CHAINS, ...Object.keys(selected())])];
  return new Promise(resolve => {
    const done = (res) => { window.removeEventListener("message", onMsg); slotsLoading = false; if (res) { slots = res; slotsAt = Date.now(); } resolve(slots); render(); };
    const onMsg = ev => { if (ev.source === window && ev.data?.type === "superlist-slots" && ev.data.id === id) done(ev.data.results); };
    window.addEventListener("message", onMsg);
    window.postMessage({ type: "superlist-slots-request", id, address: S.settings.address || {}, chains: chainsList, force }, "*");
    setTimeout(() => done(null), 45000);
  });
}
const slotLine = c => {
  if (!hasExt()) return "";
  const r = slots?.[c];
  if (!r) return slotsLoading ? `<div class="muted" style="font-size:12px">⏳ בודק מועד משלוח…</div>` : "";
  return r.ok ? `<div style="font-size:12px;color:var(--accent)">⚡ משלוח קרוב: ${esc(fmtSlot(r))}${r.price ? ` · ${money(r.price)}` : ""}</div>`
    : `<div class="muted" style="font-size:12px">⚡ ${esc(r.reason || "אין מידע")}</div>`;
};

// כרטיס "מחיר הסל" מתחת לרשימה: כמה עולה כל הרשימה בכל רשת
function basketCard() {
  const c = compareCache;
  const open = live().filter(i => !i.done);
  if (!open.length) return "";
  if (!Object.keys(selected()).length) return `<div class="card muted">💰 כדי לראות כמה עולה הסל בכל רשת, בחר סניפי אונליין ב<b>הגדרות</b>.</div>`;
  if (!c || !c.lines.length) return `<div class="card muted">💰 מחשב את מחיר הסל…</div>`;
  const total = c.lines.length;
  const ranked = c.chains.slice().sort((a, b) => (b.found === total) - (a.found === total) || a.total - b.total);
  const best = ranked[0];
  const unlinked = open.filter(i => !i.code).length;
  const fast = fastestChain(ranked.map(x => x.chain));
  // המשלוח הקרוב בכל הרשתות שאפשר להזמין בהן (גם בלי השוואת מחירים)
  const fastAll = fastestChain([...new Set([...CART_CHAINS, ...ranked.map(x => x.chain)])]);
  const summary = `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">
      ${best?.found ? `<span class="chip">💰 הכי זול: <b>${esc(best.name)}</b> ${money(best.total)}</span>` : ""}
      ${fastAll ? `<span class="chip">⚡ הכי מהיר: <b>${esc(CART_NAMES[fastAll] || chains[fastAll])}</b> · ${esc(fmtSlot(slots[fastAll]))}</span>`
        : !hasExt() ? `<button class="chip" data-act="ext-help">⚡ להצגת המשלוח המהיר ביותר – התקן את התוסף</button>`
        : !S.settings.address?.city ? `<button class="chip" data-tab-go="settings">⚡ הוסף כתובת בהגדרות כדי לראות מועדי משלוח</button>` : ""}
    </div>`;
  return `<h2>💰 מחיר הסל</h2><div class="card">${summary}
    ${ranked.map(x => `<div class="chain-card">
      <div class="grow"><div class="row"><b>${esc(x.name)}</b>${x === best && x.found ? `<span class="badge">הכי זול</span>` : ""}${x.chain === fast ? `<span class="badge" style="background:#b5470b">הכי מהיר</span>` : ""}</div>
        <div class="muted">${x.found === total ? "כל המוצרים" : `${x.found} מתוך ${total} מוצרים · חסר: ${esc(x.missing.slice(0, 2).join(", "))}${x.missing.length > 2 ? "…" : ""}`}</div>
        ${slotLine(x.chain)}</div>
      <div style="text-align:center"><div class="total">${money(x.total)}</div>
        ${CART_CHAINS.includes(x.chain) ? `<button class="btn small ghost" data-fill="${x.chain}">🛒 שלח</button>` : `<div class="muted" style="font-size:11px">הזמנה באפליקציית Wolt</div>`}</div></div>`).join("")}
    ${ranked.length > 1 && best.found === total && ranked[ranked.length - 1].found === total ? `<div class="muted" style="margin-top:6px">חיסכון לעומת היקרה: <b>${money(ranked[ranked.length - 1].total - best.total)}</b></div>` : ""}
    ${unlinked ? `<div class="muted" style="margin-top:6px">${unlinked} פריטים לא נמצאו במחירונים ולא נספרו.</div>` : ""}
    <button class="btn ghost small" style="width:100%;margin-top:8px" data-tab-go="prices">פירוט לפי מוצר</button></div>`;
}

function renderPrices() {
  const sel = selected();
  if (!Object.keys(sel).length) return `<div class="card empty">בחר סניפים להשוואה בלשונית <b>הגדרות</b> ⚙️</div>`;
  const items = live();
  const unlinked = items.filter(i => !i.code);
  const c = compareCache;
  let html = "";
  const waiting = Object.entries(PriceDB.info().data).filter(([, d]) => d.missing).map(([ch]) => chains[ch] || ch);
  if (waiting.length) html += `<div class="warn">המחירים של ${esc(waiting.join(", "))} עוד לא הורדו. הם מתעדכנים אוטומטית כל שעה, כך שסניף שנבחר עכשיו יופיע תוך שעה בערך.</div>`;
  if (!items.length) html += `<div class="card empty">הרשימה ריקה – אין מה להשוות עדיין</div>`;
  if (c && c.lines.length) {
    const ranked = c.chains.filter(x => x.found);
    const full = ranked.filter(x => x.found === c.lines.length);
    const best = (full.length ? full : ranked).slice().sort((a, b) => a.total - b.total)[0];
    const max = Math.max(...ranked.map(x => x.total), 1);
    html += `<h2>איפה הסל הכי זול?</h2><div class="card">
      ${c.chains.map(x => `<div class="chain-card">
        <div class="grow"><div class="row"><b>${esc(x.name)}</b>${best && x.chain === best.chain ? `<span class="badge">הכי זול</span>` : ""}</div>
        <div class="muted">${x.found} מתוך ${c.lines.length} מוצרים${x.missing.length ? " · חסר: " + esc(x.missing.slice(0, 3).join(", ")) + (x.missing.length > 3 ? "…" : "") : ""}</div>
        <div class="bar"><i style="width:${(x.total / max) * 100}%"></i></div></div>
        <div style="text-align:center"><div class="total">${money(x.total)}</div>
        ${CART_CHAINS.includes(x.chain) ? `<button class="btn small ghost" data-fill="${x.chain}">🛒 מלא עגלה</button>` : ""}</div></div>`).join("")}
      ${best && full.length > 1 ? `<div class="muted" style="margin-top:6px">חיסכון לעומת היקרה ביותר: <b>${money(Math.max(...full.map(x => x.total)) - best.total)}</b></div>` : ""}
    </div>
    <h2>פירוט לפי מוצר</h2>
    <div class="card scroll-x"><table><tr><th>מוצר</th>${c.chains.map(x => `<th>${esc(x.name)}</th>`).join("")}</tr>
      ${c.lines.map(l => { const vals = Object.values(l.prices); const min = Math.min(...vals);
        return `<tr><td>${esc(l.name)}${l.weighted ? ` <span class="muted">${fmtNum(l.kg)} ק״ג</span>` : l.units > 1 ? ` ×${l.units}` : ""}</td>${c.chains.map(x => { const p = l.prices[x.chain], ap = l.approx?.[x.chain];
          return `<td class="${p === min && vals.length > 1 ? "best" : ""}" ${ap ? `title="מוצר דומה: ${esc(ap)}"` : ""}>${p != null ? (ap ? "≈" : "") + money(p) : "—"}</td>`; }).join("")}</tr>`; }).join("")}
    </table></div>
    <div class="muted">≈ = לא נמצא אותו ברקוד, הושווה מוצר דומה בשמו. המחיר בטבלה הוא ליחידה או לק״ג, והסכום למעלה כבר מחושב לפי הכמות או המשקל שברשימה.</div>`;
  }
  if (unlinked.length) html += `<h2>מוצרים שעוד לא הותאמו (${unlinked.length})</h2>
    <div class="card"><div class="muted" style="margin-bottom:6px">כדי להשוות, צריך לבחור לכל פריט מוצר ספציפי. הבחירה נשמרת לפעם הבאה.</div>
      ${unlinked.map(i => `<div class="item" data-id="${i.id}"><div class="grow">${esc(i.name)}</div><button class="btn small ghost" data-act="link">בחר מוצר</button></div>`).join("")}
      <button class="btn" style="width:100%;margin-top:8px" data-act="autolink">✨ התאמה אוטומטית לכולם</button></div>`;
  html += `<h2>חיפוש מוצר</h2><div class="card"><input type="search" id="free-search" placeholder="למשל: קוטג' 5% או ברקוד">
    <div id="free-results"></div></div>`;
  return html;
}

async function searchProducts(q) {
  if (!q.trim()) return [];
  await PriceDB.load(selected());
  const r = PriceDB.search(q);
  // לא נמצא כלום? אולי שגיאת כתיב
  return r.length ? r : PriceDB.suggest(q, 30).results;
}
function resultRow(p) {
  const e = Object.entries(p.prices).sort((a, b) => a[1] - b[1]);
  return `<div class="result with-img" data-code="${esc(p.code)}" data-pname="${esc(p.name)}" data-weighted="${p.weighted ? 1 : ""}">
    ${thumb(p.code) || `<div class="thumb-ph">${p.weighted ? "⚖️" : "🛒"}</div>`}<div class="grow">
    <div>${esc(p.name)} <span class="muted">${p.manufacturer ? esc(p.manufacturer) : ""}</span></div>
    <div class="prices">${e.map(([c, v], k) => `<span class="${k === 0 && e.length > 1 ? "price-tag" : ""}">${esc(chains[c] || c)}: ${money(v)}${p.weighted ? " לק״ג" : ""}</span>`).join("")}</div></div></div>`;
}

// תמונת מוצר; אם אין במקור הראשון מנסים את השני, ואם אין בכלל התמונה נעלמת
function thumb(code, cls = "thumb", attrs = "") {
  const [a, b] = PriceDB.images(code);
  if (!a) return "";
  return `<img class="${cls}" ${attrs} src="${a}" data-alt="${b}" data-code="${esc(code)}" alt="" loading="lazy" referrerpolicy="no-referrer"
    onerror="imgFail(this)">`;
}
// אין תמונה: ברשימה פשוט לא מציגים, ברשימת חיפוש משאירים ריבוע כדי שהשורות יישארו מיושרות
function imgFail(el) {
  if (el.dataset.alt) { el.src = el.dataset.alt; el.dataset.alt = ""; return; }
  if (el.classList.contains("sm") || el.classList.contains("big-img")) return el.remove();
  el.outerHTML = `<div class="thumb-ph">🛒</div>`;
}
function imageSheet(item) {
  sheet(`<h2 style="margin-top:0">${esc(item.product || item.name)}</h2>
    ${thumb(item.code, "big-img")}
    <div class="muted" style="margin:8px 0">ברקוד ${esc(item.code)}. אם זה לא המוצר הנכון, אפשר להחליף.</div>
    <div class="row"><button class="btn grow" id="img-change">🔗 החלף מוצר</button><button class="btn ghost grow" data-close>סגור</button></div>`);
  $("#img-change").onclick = () => linkSheet(item);
}

// ================= השלמה אוטומטית בהוספת פריט =================
// בזמן הקלדה: פריטים שכבר קנית, ומוצרים כמו שהם כתובים ברשתות (עם תמונה ומחיר). שגיאת כתיב -> "האם התכוונת ל..."
let acRows = [], acSel = -1, acSeq = 0;
function acNames() {
  return [...new Set([...Object.values(S.history).map(h => h.name), ...QUICK, ...S.recipes.flatMap(r => r.ingredients.map(x => x.name))])];
}
function acHide() {
  const box = $("#ac");
  if (box) { box.classList.add("hidden"); box.innerHTML = ""; }
  $("#add-input")?.setAttribute("aria-expanded", "false");
  acRows = []; acSel = -1;
}
async function acShow() {
  const inp = $("#add-input"), box = $("#ac");
  if (!inp || !box) return;
  const p = parseQty(inp.value), q = p.name.trim();
  if (q.length < 2) return acHide();
  const seq = ++acSeq;
  const nq = norm(q);
  const mine = acNames().filter(n => norm(n).includes(nq) && norm(n) !== nq).slice(0, 3);
  let sug = { results: [], fixed: null };
  if (Object.keys(selected()).length) {
    try { await PriceDB.load(selected()); sug = PriceDB.suggest(q, 8); } catch {}
  }
  if (seq !== acSeq || document.activeElement !== inp) return;
  acRows = [...mine.map(n => ({ kind: "name", name: n })), ...sug.results.map(r => ({ kind: "product", r }))];
  if (!acRows.length && !sug.fixed) return acHide();
  acSel = -1;
  box.innerHTML = (sug.fixed ? `<div class="ac-fix" data-fix="${esc(sug.fixed)}">🔎 האם התכוונת ל: <b>${esc(sug.fixed)}</b>?</div>` : "")
    + acRows.map((x, k) => {
      if (x.kind === "name") return `<div class="ac-row" data-k="${k}" role="option"><div class="thumb-ph">📝</div><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sub">מהרשימות שלך</div></div></div>`;
      const r = x.r, e = Object.entries(r.prices).sort((a, b) => a[1] - b[1]);
      return `<div class="ac-row" data-k="${k}" role="option">${thumb(r.code) || `<div class="thumb-ph">${r.weighted ? "⚖️" : "🛒"}</div>`}
        <div class="grow"><div class="nm">${esc(r.name)}</div>
        <div class="sub">${money(e[0][1])}${r.weighted ? " לק״ג" : ""} ב${esc(chains[e[0][0]] || e[0][0])}${e.length > 1 ? ` · ב-${e.length} רשתות` : ""}</div></div></div>`;
    }).join("");
  box.classList.remove("hidden");
  inp.setAttribute("aria-expanded", "true");
}
function acPick(k) {
  const x = acRows[k], inp = $("#add-input");
  if (!x || !inp) return;
  const p = parseQty(inp.value);
  inp.value = "";
  acHide();
  if (x.kind === "name") { addItem(x.name, p.qty, null, p.unit); commit(); refreshCompare().then(render); return; }
  const r = x.r;
  addItem(r.name, p.qty, null, p.unit ?? (r.weighted ? "kg" : "unit"));
  const it = live().find(i => norm(i.name) === norm(r.name) && !i.done);
  if (it) setLink(it, r.code, r.name, r.weighted); else { commit(); refreshCompare().then(render); }
  toast("נוסף: " + r.name);
}
function acMark() {
  document.querySelectorAll("#ac .ac-row").forEach(el => el.classList.toggle("sel", Number(el.dataset.k) === acSel));
  document.querySelector("#ac .ac-row.sel")?.scrollIntoView({ block: "nearest" });
}
let acTimer;
document.addEventListener("input", e => { if (e.target.id === "add-input") { clearTimeout(acTimer); acTimer = setTimeout(acShow, 150); } });
document.addEventListener("keydown", e => {
  if (e.target.id !== "add-input" || !acRows.length || $("#ac")?.classList.contains("hidden")) return;
  if (e.key === "ArrowDown") { acSel = (acSel + 1) % acRows.length; acMark(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { acSel = acSel <= 0 ? acRows.length - 1 : acSel - 1; acMark(); e.preventDefault(); }
  else if (e.key === "Enter" && acSel >= 0) { e.preventDefault(); acPick(acSel); }
  else if (e.key === "Escape") acHide();
});
// mousedown ולא click: כדי שהשדה לא יאבד פוקוס לפני הבחירה
document.addEventListener("mousedown", e => {
  const fix = e.target.closest?.("#ac [data-fix]");
  if (fix) {
    e.preventDefault();
    const inp = $("#add-input"), p = parseQty(inp.value);
    inp.value = (p.unit === "kg" ? p.qty + " ק״ג " : p.qty > 1 ? p.qty + " " : "") + fix.dataset.fix;
    return acShow();
  }
  const row = e.target.closest?.("#ac .ac-row");
  if (row) { e.preventDefault(); return acPick(Number(row.dataset.k)); }
  if (!e.target.closest?.("#add-form")) acHide();
});

function linkSheet(item) {
  sheet(`<h2 style="margin-top:0">איזה "${esc(item.name)}"?</h2>
    <input type="search" id="l-q" value="${esc(item.name)}" placeholder="חיפוש לפי שם או ברקוד">
    <div id="l-res" class="muted" style="padding:10px 0">מחפש…</div>
    <div class="row">${item.code ? `<button class="btn ghost grow" id="l-unlink">בטל קישור</button>` : ""}<button class="btn ghost grow" data-close>סגור</button></div>`);
  const run = async () => {
    const box = $("#l-res");
    if (!box) return;
    try {
      const res = await searchProducts($("#l-q").value);
      box.innerHTML = res.length ? res.map(resultRow).join("") : "לא נמצאו מוצרים. נסה מילה אחרת.";
      box.querySelectorAll(".result").forEach(el => el.onclick = () => { setLink(item, el.dataset.code, el.dataset.pname, !!el.dataset.weighted); closeSheet(); });
    } catch (e) { box.textContent = "שגיאה בחיפוש: " + e.message; }
  };
  let t; $("#l-q").oninput = () => { clearTimeout(t); t = setTimeout(run, 300); };
  if ($("#l-unlink")) $("#l-unlink").onclick = () => { setLink(item, null, null); closeSheet(); };
  run();
}
// weighted: המוצר שנבחר נמכר במשקל (ירקות בתפזורת) או ביחידות/אריזה (למשל מארז עגבניות שרי)
function matchUnit(item, weighted) {
  if (weighted === undefined || weighted === null) return;
  if (weighted && item.unit !== "kg") Object.assign(item, { unit: "kg", qty: roundKg((item.qty || 1) * unitWeight(item.name)) });
  if (!weighted && item.unit === "kg") Object.assign(item, { unit: "unit", qty: Math.max(1, Math.round(item.qty)) });
}
function setLink(item, code, pname, weighted) {
  if (code) matchUnit(item, weighted);
  // ביטול קישור ידני: לא לקשר שוב אוטומטית
  Object.assign(item, { code, product: pname, auto: false, noLink: !code, t: now() });
  if (code && S.history[norm(item.name)]) S.history[norm(item.name)].unit = item.unit;
  const k = norm(item.name);
  if (S.history[k]) Object.assign(S.history[k], { code, product: pname, t: now() });
  else S.history[k] = { name: item.name, cat: item.cat, code, product: pname, buys: [], t: now() };
  commit(); refreshCompare().then(render);
}
async function autoLink() {
  const list = live().filter(i => !i.code);
  let n = 0;
  toast("מתאים מוצרים…");
  for (const i of list) {
    try {
      const r = await searchProducts(i.name);
      // לפריט שנמכר במשקל עדיף מוצר במשקל (עגבניה בתפזורת ולא רסק)
      const pick = (i.unit === "kg" && r.find(x => x.weighted)) || r[0];
      if (pick) { matchUnit(i, pick.weighted); Object.assign(i, { code: pick.code, product: pick.name, t: now() }); n++; }
    } catch {}
  }
  commit(); await refreshCompare(); render();
  toast(`הותאמו ${n} מתוך ${list.length}. כדאי לבדוק – לחיצה על 🔗 מחליפה מוצר.`);
}

// ================= הגדרות =================
let chainUpdates = {};

// משווים רק סניפי אונליין (המחירים של האתר), לא סניפים רגילים.
// שופרסל ורמי לוי: סניף אונליין אחד ארצי. טיב טעם: מרכז ליקוט לפי אזור.
// אושר עד לא מוכרת אונליין. יוחננוף וויקטורי לא מפרסמות קובצי מחירים לאתר (רק מילוי עגלה).
// v = באיזו גרסה הרשת נוספה (כדי לכלול אוטומטית פעם אחת רשתות חדשות אצל משתמשים קיימים)
const ONLINE = {
  shufersal: { fixed: "413", label: "שופרסל ONLINE", v: 1 },
  ramilevy: { fixed: "39", label: "רמי לוי אונליין (מרלוג אינטרנט)", v: 1 },
  carrefour: { fixed: "471", label: "קרפור אונליין", v: 2 },
  tivtaam: { match: /^ליקוט/, hint: "מרכז הליקוט של האתר שמשרת את האזור שלך" },
  wolt: { match: /וולט מרקט/, hint: "חנות וולט מרקט באזור שלך (הזמנה דרך אפליקציית Wolt)" },
};
const ONLINE_VERSION = 2;
const NO_ONLINE_PRICES = {
  hazihinam: "חצי חינם מפרסמת מחירי אונליין, אבל האתר שלה חוסם את העדכון האוטומטי (מחוץ לישראל), לכן אין לה השוואה. מילוי עגלה עובד.",
  yochananof: "יוחננוף לא מפרסמת קובץ מחירים לאתר האונליין (רק לסניפים רגילים), לכן אין לה השוואה. מילוי עגלה עובד.",
  victory: "ויקטורי לא מפרסמת כרגע קובצי מחירים, לכן אין לה השוואה. מילוי עגלה עובד.",
};

// מסדר את הבחירה: רק סניפי אונליין. בפעם הראשונה בוחר לבד את שופרסל ורמי לוי.
function ensureOnlineStores() {
  const st = S.settings.stores, names = (S.settings.storeNames ||= {});
  let changed = false;
  for (const c of Object.keys(st)) {
    const o = ONLINE[c];
    const ok = o && (o.fixed ? st[c] === o.fixed : st[c] && o.match.test(names[c] || ""));
    if (st[c] && !ok) { st[c] = o?.fixed ? o.fixed : null; changed = true; }
  }
  const v = S.settings.onlineV || 0;
  if (v < ONLINE_VERSION) {
    // רשתות אונליין שנוספו מאז הפעם האחרונה נכללות אוטומטית (אפשר להסיר בהגדרות)
    for (const [c, o] of Object.entries(ONLINE)) if (o.fixed && o.v > v && !st[c]) { st[c] = o.fixed; names[c] = o.label; }
    S.settings.onlineV = ONLINE_VERSION;
    changed = true;
  }
  if (!changed) return;
  S.settings.t = now();
  commit();
  if (window.Cloud?.user) Cloud.setPublicStores(selected()).catch(() => {});
  loadChains().then(refreshCompare).then(render);
}

// ================= התקנה כאפליקציה בטלפון =================
// אנדרואיד/כרום: הדפדפן נותן אירוע התקנה ואנחנו מציגים כפתור. אייפון: אין אירוע, מסבירים איך מוסיפים למסך הבית.
let installPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isPhone = () => matchMedia("(pointer: coarse)").matches;
const INSTALL_HIDE = "superlist-install-hidden";
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener("appinstalled", () => { installPrompt = null; toast("האפליקציה הותקנה 🎉 אפשר לפתוח אותה ממסך הבית"); render(); });
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

function installCard() {

// באנר חד-פעמי ברשימה, רק בטלפון שעוד לא התקין
function installBanner() {
  let hidden = false; try { hidden = !!localStorage.getItem(INSTALL_HIDE); } catch {}
  if (hidden || isStandalone() || !isPhone()) return "";
  return `<div class="card row" style="align-items:center"><div class="grow">📱 <b>להתקין כאפליקציה?</b><div class="muted">אייקון במסך הבית, מסך מלא, עובד גם בלי קליטה</div></div>

  if (outcome !== "accepted") toast("אפשר להתקין בכל זמן מההגדרות");

function renderSettings() {

      const status = on ? (o.fixed ? o.label : S.settings.storeNames?.[c] || "סניף " + sel[c]) + when(u) : o.fixed ? "לא נכלל בהשוואה" : "לא נבחר: " + o.hint;
      const btn = o.fixed
        ? `<button class="btn small ghost" data-toggle-online="${c}">${on ? "הסר" : "הוסף"}</button>`
        : `<button class="btn small ghost" data-pick-store="${c}">${on ? "שנה" : "בחר אזור"}</button>`;
      return `<div class="item"><div class="grow"><b>${esc(chains[c] || c)}</b><div class="muted">${esc(status)}</div></div>${btn}</div>`;
    }).join("")}
    ${Object.entries(NO_ONLINE_PRICES).map(([c, why]) => `<div class="item"><div class="grow"><b>${esc(CART_NAMES[c])}</b><div class="muted">${esc(why)}</div></div></div>`).join("")}
  </div>
  <div class="muted" style="margin-top:4px">המחירים מתעדכנים אוטומטית כל שעה. המקור: קבצי שקיפות המחירים שהרשתות מפרסמות לפי חוק; ייתכנו הבדלים קטנים מהאתר (מבצעי מועדון, דמי משלוח).</div>
  <h2>⚡ כתובת למשלוח (למועדי משלוח)</h2>
  <div class="card">
    <div class="muted" style="margin-bottom:8px">לפי הכתובת התוסף בודק אצל כל רשת מתי המשלוח הקרוב. נשמרת רק ברשימה המשותפת שלכם.</div>
    <form id="addr-form" autocomplete="off">
      <input type="text" id="addr-city" placeholder="עיר (למשל: רמת גן)" value="${esc(S.settings.address?.city || "")}" style="margin-bottom:6px">
      <div class="row"><input type="text" id="addr-street" class="grow" placeholder="רחוב" value="${esc(S.settings.address?.street || "")}">
        <input type="text" id="addr-num" placeholder="מס'" inputmode="numeric" style="width:70px" value="${esc(S.settings.address?.num || "")}"></div>
      <button class="btn" style="width:100%;margin-top:8px">שמור כתובת</button>
    </form>
    <div class="row" style="margin-top:8px"><div class="grow muted">${hasExt() ? "✓ תוסף מועדי המשלוח מותקן" : "התוסף לכרום לא מותקן"}</div>
      <button class="btn small ghost" data-act="${hasExt() ? "slots-refresh" : "ext-help"}">${hasExt() ? "בדוק עכשיו" : "איך מתקינים"}</button></div>
    ${hasExt() && slots ? `<div style="margin-top:6px">${[...new Set([...CART_CHAINS, ...Object.keys(selected())])].map(c => `<div class="row" style="font-size:13px"><b style="min-width:80px">${esc(CART_NAMES[c] || chains[c] || c)}</b><div class="grow">${slots[c]?.ok ? esc(fmtSlot(slots[c])) : `<span class="muted">${esc(slots[c]?.reason || "—")}</span>`}</div></div>`).join("")}</div>` : ""}
  </div>
  <h2>כפתור מילוי העגלה</h2>
  <div class="card"><div class="muted" style="margin-bottom:8px">סימנייה שממלאת את העגלה באתר הסופר מתוך הרשימה. מוסיפים אותה פעם אחת.</div>
    <button class="btn ghost" style="width:100%" data-act="bookmark">🛒 איך מוסיפים את כפתור המילוי</button></div>
  <h2>החשבון</h2>
  <div class="card row"><div class="grow">${window.Cloud?.user ? esc(Cloud.user.email) : "מצב מקומי (בלי Firebase)"}</div>
    <button class="btn ghost small" data-act="share">👥 שיתוף</button></div>`;
}

async function loadChains() {
  chains = PriceDB.CHAIN_NAMES;
  try { await PriceDB.load(selected()); chainUpdates = PriceDB.info().status?.stores || {}; } catch {}
}

async function storeSheet(chain) {
  sheet(`<h2 style="margin-top:0">סניף ${esc(chains[chain])}</h2>
    <input type="search" id="s-q" placeholder="חיפוש עיר או סניף">
    <div id="s-res" class="muted" style="padding:10px 0">טוען סניפים… (בפעם הראשונה זה יכול לקחת כמה שניות)</div>
    <div class="row"><button class="btn ghost grow" id="s-none">ללא</button><button class="btn ghost grow" data-close>סגור</button></div>`);
  let stores = [];
  try { stores = (await PriceDB.stores(chain)).filter(s => !ONLINE[chain]?.match || ONLINE[chain].match.test(s.name)); }
  catch (e) { $("#s-res").textContent = "רשימת הסניפים עוד לא הורדה. היא מתעדכנת אוטומטית כל שעה – נסה שוב מאוחר יותר."; return; }
  if (ONLINE[chain]?.hint) $("#s-q").placeholder = "בחר " + ONLINE[chain].hint;
  const draw = () => {
    const q = norm($("#s-q")?.value);
    const list = stores.filter(s => !q || norm(`${s.name} ${s.city} ${s.address}`).includes(q)).slice(0, 80);
    const box = $("#s-res");
    if (!box) return;
    box.innerHTML = list.map(s => `<div class="result" data-sid="${esc(s.id)}" data-sname="${esc(s.name)}"><b>${esc(s.name)}</b>
      <div class="muted">${[/^\d+$/.test(s.city) ? "" : s.city, s.address].filter(Boolean).map(esc).join(", ")} · מס' ${esc(s.id)}</div></div>`).join("") || "לא נמצא";
    box.querySelectorAll(".result").forEach(el => el.onclick = () => setStore(chain, el.dataset.sid, el.dataset.sname));
  };
  $("#s-q").oninput = draw;
  $("#s-none").onclick = () => setStore(chain, null, null);
  draw();
}
function setStore(chain, id, name) {
  S.settings.stores[chain] = id;
  (S.settings.storeNames ||= {})[chain] = name;
  S.settings.onlineV = Math.max(S.settings.onlineV || 0, ONLINE_VERSION);
  S.settings.t = now();
  closeSheet(); commit();
  // העדכון האוטומטי ב-GitHub קורא את הסניפים מכאן (רק מספרי סניפים, בלי מידע אישי)
  if (window.Cloud?.user) Cloud.setPublicStores(selected()).catch(e => toast("לא הצלחתי לשמור את הסניף: " + (e.code || e.message)));
  if (id) toast("הסניף נשמר. המחירים שלו יופיעו תוך שעה בערך");
  loadChains().then(() => { refreshCompare().then(render); });
}

// ================= תשתית תצוגה =================
function render() {
  const view = $("#view");
  const focus = document.activeElement?.id, val = focus && $("#" + focus)?.value;
  view.innerHTML = gate !== "ok" ? renderGate() : { list: renderList, meals: renderMeals, prices: renderPrices, settings: renderSettings }[tab]();
  if (focus && $("#" + focus)) { const el = $("#" + focus); el.value = val; el.focus(); }
  if (focus === "add-input" && val) acShow();
  const fs = $("#free-search");
  if (fs) { let t; fs.oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const res = await searchProducts(fs.value).catch(() => []);
    $("#free-results").innerHTML = res.map(resultRow).join("");
    $("#free-results").querySelectorAll(".result").forEach(el => el.onclick = () => { addItem(el.dataset.pname); const it = live().find(i => i.name === el.dataset.pname); if (it) setLink(it, el.dataset.code, el.dataset.pname, !!el.dataset.weighted); toast("נוסף לרשימה"); });
  }, 300); }; }
}

function sheet(html) {
  $("#sheet-root").innerHTML = `<div class="sheet-bg"><div class="sheet">${html}</div></div>`;
  const bg = $(".sheet-bg");
  bg.onclick = e => { if (e.target === bg || e.target.matches("[data-close]")) closeSheet(); };
  const first = bg.querySelector("input");
  if (first && matchMedia("(pointer: fine)").matches) first.focus();
}
function closeSheet() { $("#sheet-root").innerHTML = ""; }
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.append(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}

document.querySelector("nav").onclick = async e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  window.scrollTo(0, 0);
  render();
  if (tab === "prices") { await refreshCompare(); render(); }
  if (tab === "settings") { await loadChains(); render(); }
};

$("#view").addEventListener("submit", e => {
  if (e.target.id === "addr-form") {
    e.preventDefault();
    S.settings.address = { city: $("#addr-city").value.trim(), street: $("#addr-street").value.trim(), num: $("#addr-num").value.trim() };
    S.settings.t = now();
    commit(); toast("הכתובת נשמרה");
    slots = null; requestSlots(true);
    return;
  }
  if (e.target.id !== "add-form") return;
  e.preventDefault();
  const inp = $("#add-input");
  // "1.5 ק"ג עגבניות", "500 גרם בננות", "3 חלב", "חלב x2"
  const p = parseQty(inp.value);
  addItem(p.name, p.qty, null, p.unit);
  inp.value = "";
  commit(); refreshCompare().then(render);
});

$("#view").addEventListener("click", e => {
  const t = e.target;
  const add = t.closest("[data-add]");
  if (add) { addItem(add.dataset.add); commit(); return; }
  const ra = t.closest("[data-recipe-add]");
  if (ra) return addRecipeSheet(S.recipes.find(r => r.id === ra.dataset.recipeAdd));
  const er = t.closest("[data-edit-recipe]");
  if (er) return recipeSheet(er.dataset.editRecipe);
  const fc = t.closest("[data-fill]");
  if (fc) return fillCart(fc.dataset.fill);
  const go = t.closest("[data-tab-go]");
  if (go) return document.querySelector(`nav button[data-tab="${go.dataset.tabGo}"]`)?.click();
  const tg = t.closest("[data-toggle-online]");
  if (tg) { const c = tg.dataset.toggleOnline; return setStore(c, S.settings.stores[c] ? null : ONLINE[c].fixed, ONLINE[c].label); }
  const ps = t.closest("[data-pick-store]");
  if (ps) return storeSheet(ps.dataset.pickStore);
  const act = t.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "install") return doInstall();
  if (act === "install-help") return sheet(`${installCard()}<button class="btn ghost" style="width:100%;margin-top:8px" data-close>סגור</button>`);
  if (act === "install-hide") { try { localStorage.setItem(INSTALL_HIDE, "1"); } catch {} toast("אפשר להתקין בכל זמן מההגדרות"); return render(); }
  const item = S.items.find(i => i.id === t.closest("[data-id]")?.dataset.id);
  const touch = () => { item.t = now(); commit(); };
  switch (act) {
    case "toggle": item.done = !item.done; return touch();
    case "inc": item.qty = item.unit === "kg" ? roundKg((item.qty || 0) + KG_STEP) : (item.qty || 1) + 1; touch(); return refreshCompare().then(render);
    case "dec": {
      const min = item.unit === "kg" ? KG_STEP : 1;
      if ((item.qty || min) > min) { item.qty = item.unit === "kg" ? roundKg(item.qty - KG_STEP) : item.qty - 1; touch(); refreshCompare().then(render); }
      return;
    }
    case "unit": {
      // החלפה בין ק"ג ליחידות (למשל אבטיח אחד, או מלפפונים במארז). נזכר לפעם הבאה.
      if (item.unit === "kg") Object.assign(item, { unit: "unit", qty: Math.max(1, Math.round(item.qty / unitWeight(item.name))) });
      else Object.assign(item, { unit: "kg", qty: roundKg(item.qty * unitWeight(item.name)) });
      const h = S.history[norm(item.name)];
      if (h) h.unit = item.unit; else S.history[norm(item.name)] = { name: item.name, cat: item.cat, unit: item.unit, buys: [], t: now() };
      toast(item.unit === "kg" ? `${item.name}: לפי משקל (ק״ג)` : `${item.name}: לפי כמות (יחידות/אריזות)`);
      touch(); return refreshCompare().then(render);
    }
    case "del": item.deleted = true; item.delBy = me || null; return touch();
    case "link": return linkSheet(item);
    case "img": return imageSheet(item);
    case "finish": return finishShopping();
    case "recipe-library": return librarySheet();
    case "recipe-import": return importRecipeSheet();
    case "autolink": return autoLink();
    case "import": return importSheet();
    case "send": return sendSheet();
    case "share": return shareSheet();
    case "bookmark": return bookmarkSheet();
    case "ext-help": e.preventDefault(); return extSheet();
    case "slots-refresh": slots = null; return requestSlots(true);
    case "login": return Cloud.signIn().catch(e => toast("ההתחברות נכשלה: " + (e.code || e.message)));
    case "logout": return Cloud.signOut();
  }
});

// ================= התחברות והפעלה =================
let gate = "loading"; // loading / login / denied / ok

function renderGate() {
  if (gate === "loading") return `<div class="card empty">טוען…</div>`;
  if (gate === "login") return `<div class="card" style="text-align:center;padding:28px 16px">
      <div style="font-size:42px">🛒</div><h2 style="color:var(--text);font-size:20px">ברוך הבא לסל החכם</h2>
      <div class="muted" style="margin-bottom:16px">נכנסים עם חשבון Google. הרשימה נשמרת בענן ומשותפת עם מי שתבחר.</div>
      <button class="btn" data-act="login" style="width:100%">התחברות עם Google</button></div>`;
  return `<div class="card" style="text-align:center;padding:24px 16px">
      <div style="font-size:36px">🔒</div><h2 style="color:var(--text)">אין לך עדיין גישה לרשימה</h2>
      <div class="muted">אתה מחובר בתור <b dir="ltr">${esc(window.Cloud?.email() || "")}</b>.<br>
      בקש ממי שיצר את הרשימה להוסיף את המייל הזה ב"שיתוף הרשימה", ואז רענן את הדף.</div>
      <div class="row" style="margin-top:14px"><button class="btn grow" onclick="location.reload()">רענון</button>
      <button class="btn ghost grow" data-act="logout">חשבון אחר</button></div></div>`;
}

function listen() {
  if (unwatch) unwatch();
  unwatch = Cloud.watch(data => {
    if (gate !== "ok") { gate = "ok"; render(); }
    if (data) onServerData(data);
  }, async code => {
    unwatch = null;
    if (code !== "permission-denied") { setOnline(false); return; }
    // אין גישה: או שהרשימה עוד לא קיימת (אז יוצרים אותה), או שהמייל לא ברשימת השותפים
    try {
      await Cloud.createList(JSON.parse(JSON.stringify(S)));
      toast("נוצרה רשימה חדשה. אפשר לשתף אותה דרך \"שיתוף הרשימה\"");
      listen();
    } catch {
      gate = "denied"; render();
    }
  });
}

function startCloud() {
  if (!window.Cloud || !Cloud.configured) {
    // בלי Firebase (למשל בבדיקה): הכל נשמר רק בדפדפן הזה
    gate = "ok"; setOnline(false); render();
    onlineChecked = true; ensureOnlineStores();
    loadChains().then(refreshCompare).then(render).then(() => requestSlots());
    return;
  }
  Cloud.onUser(user => {
    if (!user) { gate = "login"; if (unwatch) { unwatch(); unwatch = null; } render(); return; }
    if (!me && user.displayName) { me = user.displayName.split(" ")[0]; try { localStorage.setItem(ME_KEY, me); } catch {} }
    gate = "loading"; render();
    listen();
    loadChains().then(refreshCompare).then(render).then(() => requestSlots());
  });
}

S = fill(S);
setOnline(false);
// קיצורי הדרך מהאייקון (לחיצה ארוכה): ./#list, ./#meals
{ const h = location.hash.slice(1); if (["list", "meals", "prices", "settings"].includes(h)) { tab = h; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === h)); } }
render();
if (window.Cloud) startCloud();
else {
  window.addEventListener("cloud-ready", startCloud, { once: true });
  // אם Firebase לא נטען (אין אינטרנט) - ממשיכים במצב מקומי
  setTimeout(() => { if (!window.Cloud) { gate = "ok"; render(); } }, 8000);
}
</script>
<script type="module" src="cloud.js"></script>
</body>
</html>
