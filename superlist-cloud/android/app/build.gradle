plugins {
    id 'com.android.application'
}

android {
    namespace 'il.superlist.cart'
    compileSdk 34

    defaultConfig {
        applicationId 'il.superlist.cart'
        minSdk 24
        targetSdk 34
        // כל בנייה ב-GitHub מקבלת מספר גדול יותר, כדי שאפשר יהיה להתקין עדכון מעל הגרסה הקודמת
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.${System.getenv('VERSION_CODE') ?: '0'}"
    }

    // מפתח החתימה מגיע מהסוד ANDROID_KEYSTORE_B64 ב-GitHub (לא נשמר בקוד)
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.p12')
            storeType 'pkcs12'
            storePassword 'superlist'
            keyAlias 'superlist'
            keyPassword 'superlist'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // התחברות עם חשבון Google שבטלפון (Google לא מאפשרת להתחבר מתוך דף אינטרנט שבתוך אפליקציה)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // סריקת ברקוד עם הסורק של Google (בלי הרשאת מצלמה לאפליקציה)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
